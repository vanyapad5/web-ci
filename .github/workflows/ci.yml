name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірка файлів
        run: |
          test -f Dockerfile
          grep -q "Версія" site/index.html
      - name: Збирання образу
        run: docker build -t web-ci .
      - name: Запуск і перевірка сайту
        run: |
          docker run -d --name site -p 8080:80 web-ci
          sleep 2
          curl -s http://localhost:8080 | grep "Версія"
